<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelica Blanco Mora - Data Engineer | FinOps & AI Analytics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #eee; line-height: 1.7; background: #0a0a0a; }

        /* VIDEO BACKGROUND */
        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; background: #0a0a0a url('bg-city.gif') center/cover no-repeat; }
        .video-bg video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: -1; }

        .lang-switch { 
            position: fixed; top: 20px; right: 20px; z-index: 10; 
            background: #00d4ff; color: #000; border: none; 
            padding: 10px 18px; border-radius: 20px; 
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .lang-switch:hover { background: #00a8cc; transform: scale(1.05); }

        .nav { position: sticky; top: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 15px; z-index: 9; display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        .nav a { color: #00d4ff; text-decoration: none; font-weight: 600; }
        .nav a:hover { text-decoration: underline; }

        .container { position: relative; z-index: 1; max-width: 950px; margin: 0 auto; padding: 60px 30px; }
        header { text-align: center; padding: 40px 0 60px 0; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        h2 { font-size: 1.4rem; color: #00d4ff; margin-bottom: 25px; }
        h3 { font-size: 1.9rem; margin: 50px 0 20px 0; border-bottom: 2px solid #00d4ff; padding-bottom: 10px; }
        h4 { font-size: 1.3rem; color: #00d4ff; margin: 25px 0 10px 0; }
        p { margin-bottom: 15px; }
        ul { margin-left: 25px; margin-bottom: 15px; }
        .card { background: rgba(25, 25, 25, 0.9); padding: 30px; margin-bottom: 25px; border-radius: 8px; border-left: 4px solid #00d4ff; }
        .skills-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .skill-tag { background: rgba(0, 212, 255, 0.15); border: 1px solid #00d4ff; color: #00d4ff; padding: 8px 15px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        
        [lang="es"] { display: none; }
        @media (max-width: 768px) {.video-bg video { display: none; } h1{font-size:2.2rem}}
    </style>
</head>
<body>
    <button class="lang-switch" id="langBtn" onclick="toggleLang()">ES</button>
